# 与仓库根目录 compose.yaml 合并使用；环境文件、数据和密钥留在服务器。
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
# 模型地址由 LLM_BASE_URL 指定，远程部署使用公有 HTTPS 网关和标准证书校验。
services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_parallel_workers_per_gather=0", "-c", "statement_timeout=10000"]
    mem_limit: 320m
    logging: *logging
  migrate:
    build:
      args: {SOURCE_COMMIT: "${SOURCE_COMMIT:?required}"}
    mem_limit: 384m
    logging: *logging
  roles:
    mem_limit: 256m
    logging: *logging
  api:
    mem_limit: 256m
    logging: *logging
  worker:
    mem_limit: 384m
    logging: *logging
  import:
    volumes: ["${CSV_DIR:?required}:/data:ro"]
    mem_limit: 384m
    logging: *logging
  web:
    image: olist-python-web:${WEB_TAG:-${APP_TAG:?required}}
    build:
      args: {SOURCE_COMMIT: "${SOURCE_COMMIT:?required}"}
    mem_limit: 64m
    logging: *logging
