# 仅供独立评测，数据位于临时内存文件系统；不挂载项目运行数据库卷。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_DB: test
      POSTGRES_PASSWORD: ${UNDERSTANDING_TEST_PASSWORD:?set test-only password}
    ports: ["127.0.0.1:${UNDERSTANDING_POSTGRES_PORT:-15432}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 192m
    healthcheck:
      test: [CMD, pg_isready, -U, test, -d, test]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${UNDERSTANDING_TEST_PASSWORD:?set test-only password}
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1:${UNDERSTANDING_MYSQL_PORT:-13306}:3306"]
    tmpfs: [/var/lib/mysql]
    mem_limit: 768m
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 2s
      timeout: 3s
      retries: 60
