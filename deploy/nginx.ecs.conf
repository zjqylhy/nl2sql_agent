# 宿主 Nginx 的 http {} 内加载。替换域名与证书路径，先 nginx -t 再 reload。
server {
    listen 80;
    server_name analysis.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://analysis.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name analysis.example.com;
    ssl_certificate /etc/olist/tls/fullchain.pem;
    ssl_certificate_key /etc/olist/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 先验证当前域名的 HTTPS，不将子域或 preload 纳入首次上线。
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log off;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖公网客户端自填的代理链，容器 web 再追加宿主地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}
