# 先创建 olist namespace、olist-config ConfigMap 与 olist-secrets Secret。
# 镜像地址由发布流水线替换；数据库使用云托管服务，不在此部署。
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: olist}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: REGISTRY/olist-api:VERSION
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: olist-config}}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: olist-secrets, key: DATABASE_URL}}}
            - {name: SERVICE_KEY, valueFrom: {secretKeyRef: {name: olist-secrets, key: SERVICE_KEY}}}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: AGENT_URL, value: "http://agent:8000"}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: olist}
spec: {selector: {app: api}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent, namespace: olist}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: REGISTRY/olist-agent:VERSION
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: olist-config}}]
          env:
            - {name: TENANT_DATASOURCES, valueFrom: {secretKeyRef: {name: olist-secrets, key: TENANT_DATASOURCES}}}
            - {name: SERVICE_KEY, valueFrom: {secretKeyRef: {name: olist-secrets, key: SERVICE_KEY}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: olist-secrets, key: LLM_API_KEY, optional: true}}}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: mysql-ca, mountPath: /run/secrets/mysql, readOnly: true}]
      volumes: [{name: mysql-ca, secret: {secretName: mysql-ca}}]
---
# 默认只限制入站；数据库和模型出站由云安全组/出口策略配置。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: private-services, namespace: olist}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [api, agent]}]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: web}}}]
      ports: [{protocol: TCP, port: 8080}]
    - from: [{podSelector: {matchLabels: {app: api}}}]
      ports: [{protocol: TCP, port: 8000}]
---
# 替换域名，事先创建 TLS Secret，并配置现有 ingress controller。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: olist}
spec:
  ingressClassName: nginx
  tls: [{hosts: [analysis.example.com], secretName: olist-web-tls}]
  rules:
    - host: analysis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 8080}}}
---
apiVersion: v1
kind: Service
metadata: {name: agent, namespace: olist}
spec: {selector: {app: agent}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: olist}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: REGISTRY/olist-web:VERSION
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: temp, mountPath: /tmp}]
      volumes: [{name: temp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: olist}
spec: {selector: {app: web}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: platform-migrate, namespace: olist}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: migrate
          image: REGISTRY/olist-api:VERSION
          args: ["-command","migrate"]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: olist-secrets, key: MIGRATION_DATABASE_URL}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
