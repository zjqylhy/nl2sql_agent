name: olist-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_DB: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    command: ["-command","migrate"]
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
  agent:
    build: {context: ., dockerfile: deploy/Dockerfile.agent}
    environment:
      SERVICE_KEY: ${SERVICE_KEY:?set SERVICE_KEY}
      TENANT_DATASOURCES: ${TENANT_DATASOURCES:-{}}
      LLM_API_KEY: ${NL2SQL_AGENT_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_INTENT_MAX_TOKENS: ${LLM_INTENT_MAX_TOKENS:-256}
      LLM_PLAN_MAX_TOKENS: ${LLM_PLAN_MAX_TOKENS:-512}
    depends_on:
      mysql: {condition: service_healthy}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?sslmode=disable
      SERVICE_KEY: ${SERVICE_KEY:?set SERVICE_KEY}
      AGENT_URL: http://agent:8000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate: {condition: service_completed_successfully}
      agent: {condition: service_started}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    ports: ["127.0.0.1:${HTTP_PORT:-8088}:8080"]
    depends_on: [api]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres_data:
  mysql_data:
networks:
  backend:
