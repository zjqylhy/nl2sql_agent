name: Live agent acceptance
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 已发布基线的完整 commit SHA
        required: true
        type: string
permissions: {contents: read}
jobs:
  live-agent-quality:
    runs-on: ubuntu-latest
    environment: agent-evaluation
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test-only-ci-password, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: test-only-ci-password, MYSQL_ROOT_HOST: "%"}
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h localhost --silent" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test-only-ci-password@localhost:5432/test?sslmode=disable
      MYSQL_TEST_HOST: localhost
      MYSQL_TEST_PASSWORD: test-only-ci-password
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline identity
        env: {BASELINE: "${{ inputs.baseline_ref }}"}
        run: '[[ "$BASELINE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .cache/baseline
      - uses: actions/setup-go@v5
        with: {go-version: "1.27"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r agent/requirements.lock
      - name: Three rounds against the same model
        run: bash scripts/compare_agent.sh .cache/baseline live acceptance
        env:
          LLM_API_KEY: ${{ secrets.NL2SQL_AGENT_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agent-acceptance
          path: .cache/evaluation/*.json
          if-no-files-found: error
