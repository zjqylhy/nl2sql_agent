name: Agent quality
on: [push, pull_request]
permissions: {contents: read}
jobs:
  agent-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test-only-ci-password, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-only-ci-password@localhost:5432/test?sslmode=disable
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Select comparison commit
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ref="${PR_BASE:-$(git rev-parse HEAD^)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: .cache/baseline
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # 历史基线额外依赖仅用于质量对照，不进入当前运行镜像。
      - run: pip install -r .cache/baseline/agent/requirements.lock -r agent/requirements.lock
      - run: bash scripts/compare_agent.sh .cache/baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-agent-quality
          path: .cache/evaluation/*.json
          if-no-files-found: error
