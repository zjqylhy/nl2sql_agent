[project]
name = "nl2sql-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "sqlglot>=26,<31", "pymysql[rsa]>=1.1,<2", "langgraph==1.2.15", "langgraph-checkpoint-postgres==3.2.0", "psycopg[binary,pool]>=3.3,<4", "sqlalchemy>=2,<3", "alembic>=1.16,<2", "bcrypt>=4,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
